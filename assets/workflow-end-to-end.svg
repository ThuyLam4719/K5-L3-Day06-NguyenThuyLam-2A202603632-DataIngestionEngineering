<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Workflow từ tài liệu PDF đến top-3 evidence</title>
  <desc id="desc">Sơ đồ pipeline Python đọc và chuẩn hóa PDF, tạo cấu hình chunk A/B, embedding bằng Gemini Embedding 2, lưu pgvector; người dùng nhập câu hỏi, truy vấn top-3 theo A/B/C và nhận các đoạn evidence có nguồn.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="0.55" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f4fbf8"/>
    </linearGradient>
    <linearGradient id="gemini" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4dff"/><stop offset="1" stop-color="#17b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18304d" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11 Z" fill="#7085a4"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11 Z" fill="#13a995"/>
    </marker>
    <style>
      .title{font:700 42px Inter,Segoe UI,Arial,sans-serif;fill:#142942}
      .subtitle{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#526782}
      .section{font:700 15px Inter,Segoe UI,Arial,sans-serif;letter-spacing:2px;fill:#7285a0}
      .cardTitle{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#182e49}
      .body{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#425873}
      .small{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#60748e}
      .tiny{font:600 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.5px;fill:#60748e}
      .tag{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1px}
      .white{fill:#fff}
      .mono{font:600 13px Consolas,Menlo,monospace;fill:#3e5573}
    </style>
  </defs>

  <rect width="1800" height="1280" fill="url(#bg)"/>
  <circle cx="1690" cy="112" r="125" fill="#e9e4ff" opacity=".55"/>
  <circle cx="95" cy="1100" r="150" fill="#dcf5ee" opacity=".48"/>
  <path d="M0 500 C360 455 500 550 850 495 S1430 465 1800 520" fill="none" stroke="#e5edf8" stroke-width="2"/>

  <text x="60" y="54" class="section">DATA INGESTION ENGINEERING · END-TO-END</text>
  <text x="60" y="104" class="title">Từ PDF đến top-3 evidence</text>
  <text x="60" y="137" class="subtitle">Luồng thật trong src/: Python ingest → Gemini embeddings → PostgreSQL/pgvector → truy xuất A/B/C → đoạn nguồn có thể kiểm chứng.</text>

  <text x="60" y="178" class="section">01 · NẠP VÀ LƯU TRI THỨC</text>

  <!-- PDF input -->
  <g filter="url(#shadow)">
    <rect x="60" y="198" width="292" height="260" rx="22" fill="#fff"/>
    <rect x="60" y="198" width="292" height="9" rx="5" fill="#f05b6c"/>
  </g>
  <circle cx="101" cy="243" r="24" fill="#fff0f1"/>
  <path d="M91 229h15l8 8v20H91z" fill="#fff" stroke="#e65367" stroke-width="2"/>
  <path d="M106 229v9h8M96 244h13M96 249h13" fill="none" stroke="#e65367" stroke-width="2" stroke-linecap="round"/>
  <text x="137" y="250" class="cardTitle">Tài liệu đầu vào</text>
  <text x="82" y="294" class="body">PDF · data-for-lab.pdf</text>
  <text x="82" y="322" class="small">60 trang vật lý · nguồn truy vết</text>
  <rect x="82" y="350" width="245" height="1" fill="#e8edf5"/>
  <text x="82" y="379" class="tag" fill="#d94c60">INPUT</text>
  <text x="82" y="409" class="small">Được đọc theo từng trang PDF.</text>
  <text x="82" y="433" class="small">document_id · source · page</text>

  <!-- Extract / normalize -->
  <g filter="url(#shadow)">
    <rect x="385" y="198" width="292" height="260" rx="22" fill="#fff"/>
    <rect x="385" y="198" width="292" height="9" rx="5" fill="#3787e8"/>
  </g>
  <circle cx="426" cy="243" r="24" fill="#eaf3ff"/>
  <path d="M415 232h21M415 239h14M415 246h18M415 253h11" stroke="#2d77cf" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="438" cy="253" r="4" fill="#2d77cf"/>
  <text x="462" y="250" class="cardTitle">Trích xuất &amp; chuẩn hóa</text>
  <text x="407" y="294" class="body">pypdf · Python</text>
  <text x="407" y="322" class="small">Unicode NFC · khoảng trắng</text>
  <text x="407" y="350" class="small">Nhật ký từng trang:</text>
  <text x="407" y="374" class="mono">status · error · char_count</text>
  <rect x="407" y="393" width="245" height="1" fill="#e8edf5"/>
  <text x="407" y="423" class="small">Lỗi/trang rỗng được ghi log.</text>
  <text x="407" y="444" class="tiny">ingestion_log.jsonl</text>

  <!-- Chunking -->
  <g filter="url(#shadow)">
    <rect x="710" y="198" width="350" height="260" rx="22" fill="#fff"/>
    <rect x="710" y="198" width="350" height="9" rx="5" fill="#f3a62f"/>
  </g>
  <circle cx="752" cy="243" r="24" fill="#fff4df"/>
  <rect x="741" y="231" width="22" height="8" rx="3" fill="#e59a20"/>
  <rect x="741" y="243" width="15" height="8" rx="3" fill="#f1b84f"/>
  <rect x="741" y="255" width="22" height="5" rx="2" fill="#f5d18d"/>
  <text x="788" y="250" class="cardTitle">Tạo chunk · 2 cấu hình</text>
  <rect x="733" y="280" width="140" height="105" rx="13" fill="#fff8e9" stroke="#f5d28e"/>
  <text x="749" y="307" class="tag" fill="#b77810">A · FIXED</text>
  <text x="749" y="335" class="body">500 ký tự</text>
  <text x="749" y="359" class="small">overlap 50</text>
  <text x="749" y="378" class="tiny">277 CHUNKS</text>
  <rect x="890" y="280" width="148" height="105" rx="13" fill="#ecfbf7" stroke="#a7e6d8"/>
  <text x="906" y="307" class="tag" fill="#118e7c">B · PARAGRAPH</text>
  <text x="906" y="335" class="body">Tối đa 800</text>
  <text x="906" y="359" class="small">gom/tách đoạn</text>
  <text x="906" y="378" class="tiny">221 CHUNKS</text>
  <text x="733" y="421" class="small">Mỗi chunk giữ ID, trang, section, vị trí.</text>
  <text x="733" y="444" class="tiny">chunks_A_fixed.jsonl · chunks_B_paragraph.jsonl</text>

  <!-- Gemini doc embeddings -->
  <g filter="url(#shadow)">
    <rect x="1093" y="198" width="292" height="260" rx="22" fill="#fff"/>
    <rect x="1093" y="198" width="292" height="9" rx="5" fill="url(#gemini)"/>
  </g>
  <circle cx="1135" cy="243" r="24" fill="#f0edff"/>
  <path d="M1135 225l4.5 13.5L1153 243l-13.5 4.5L1135 261l-4.5-13.5L1117 243l13.5-4.5z" fill="url(#gemini)"/>
  <text x="1171" y="250" class="cardTitle">Embedding tài liệu</text>
  <text x="1115" y="294" class="body">Google Gemini API</text>
  <text x="1115" y="322" class="small">gemini-embedding-2</text>
  <text x="1115" y="350" class="small">768 chiều · A và B dùng cùng model</text>
  <rect x="1115" y="369" width="248" height="1" fill="#e8edf5"/>
  <text x="1115" y="398" class="tiny">DOCUMENT PREFIX</text>
  <text x="1115" y="422" class="mono">title: … | text: …</text>
  <text x="1115" y="445" class="small">1 vector cho mỗi chunk</text>

  <!-- pgvector -->
  <g filter="url(#shadow)">
    <rect x="1418" y="198" width="322" height="260" rx="22" fill="#fff"/>
    <rect x="1418" y="198" width="322" height="9" rx="5" fill="#13a995"/>
  </g>
  <circle cx="1461" cy="243" r="24" fill="#e6faf6"/>
  <ellipse cx="1461" cy="235" rx="13" ry="5" fill="#18aa96"/>
  <path d="M1448 235v17c0 3 6 6 13 6s13-3 13-6v-17M1448 244c0 3 6 6 13 6s13-3 13-6" fill="none" stroke="#118d7c" stroke-width="2"/>
  <text x="1498" y="250" class="cardTitle">Vector database</text>
  <text x="1440" y="294" class="body">PostgreSQL + pgvector</text>
  <text x="1440" y="322" class="small">Bảng day6_chunks · vector(768)</text>
  <text x="1440" y="350" class="small">JSONB metadata · upsert theo ID</text>
  <rect x="1440" y="369" width="278" height="1" fill="#e8edf5"/>
  <text x="1440" y="398" class="tiny">SIMILARITY</text>
  <text x="1440" y="422" class="mono">cosine distance · &lt;=&gt;</text>
  <text x="1440" y="445" class="small">A và B lưu riêng strategy</text>

  <!-- top connectors -->
  <path d="M354 328h24" fill="none" stroke="#7085a4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M679 328h24" fill="none" stroke="#7085a4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1062 328h24" fill="none" stroke="#7085a4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1387 328h24" fill="none" stroke="#7085a4" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="60" y="529" class="section">02 · CÂU HỎI VÀ TRUY XUẤT</text>

  <!-- DB to retrieval connector -->
  <path d="M1578 459v62h-278v42" fill="none" stroke="#13a995" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowTeal)"/>
  <rect x="1394" y="494" width="215" height="28" rx="14" fill="#e6faf6"/>
  <text x="1501" y="513" text-anchor="middle" class="tiny" fill="#118e7c">VECTOR + METADATA</text>

  <!-- Question input -->
  <g filter="url(#shadow)">
    <rect x="60" y="565" width="292" height="280" rx="22" fill="#fff"/>
    <rect x="60" y="565" width="292" height="9" rx="5" fill="#8b63ee"/>
  </g>
  <circle cx="101" cy="610" r="24" fill="#f1edff"/>
  <path d="M89 600h24a4 4 0 0 1 4 4v13a4 4 0 0 1-4 4h-9l-7 6v-6h-8a4 4 0 0 1-4-4v-13a4 4 0 0 1 4-4z" fill="none" stroke="#7653d6" stroke-width="2"/>
  <text x="137" y="617" class="cardTitle">Người dùng hỏi</text>
  <text x="82" y="663" class="body">Câu hỏi truy vấn</text>
  <text x="82" y="692" class="small">Hiện tại: lấy từ benchmark</text>
  <text x="82" y="715" class="mono">data/format.json</text>
  <rect x="82" y="735" width="245" height="1" fill="#e8edf5"/>
  <text x="82" y="765" class="tiny">20 CÂU · DEV 15 / TEST 5</text>
  <rect x="82" y="785" width="114" height="32" rx="16" fill="#f3efff"/>
  <text x="139" y="806" text-anchor="middle" class="tiny" fill="#7251d4">FILTER?</text>
  <text x="207" y="806" class="small">section nếu có</text>

  <!-- query embedding -->
  <g filter="url(#shadow)">
    <rect x="385" y="565" width="292" height="280" rx="22" fill="#fff"/>
    <rect x="385" y="565" width="292" height="9" rx="5" fill="url(#gemini)"/>
  </g>
  <circle cx="426" cy="610" r="24" fill="#f0edff"/>
  <path d="M426 592l4.5 13.5L444 610l-13.5 4.5L426 628l-4.5-13.5L408 610l13.5-4.5z" fill="url(#gemini)"/>
  <text x="462" y="617" class="cardTitle">Embedding câu hỏi</text>
  <text x="407" y="663" class="body">Cùng Gemini model</text>
  <text x="407" y="692" class="small">gemini-embedding-2</text>
  <text x="407" y="720" class="small">768 chiều · vector query</text>
  <rect x="407" y="740" width="248" height="1" fill="#e8edf5"/>
  <text x="407" y="771" class="tiny">QUERY PREFIX</text>
  <text x="407" y="799" class="mono">task: search result</text>
  <text x="407" y="823" class="mono">| query: …</text>

  <!-- Retrieval strategies -->
  <g filter="url(#shadow)">
    <rect x="710" y="565" width="590" height="280" rx="22" fill="#fff"/>
    <rect x="710" y="565" width="590" height="9" rx="5" fill="#13a995"/>
  </g>
  <text x="738" y="613" class="cardTitle">Tìm top-3 bằng cosine similarity</text>
  <text x="738" y="638" class="small">PgVectorStore.search() · ORDER BY embedding &lt;=&gt; query</text>
  <rect x="738" y="658" width="534" height="48" rx="12" fill="#fff7e8"/>
  <circle cx="761" cy="682" r="13" fill="#f4b23f"/><text x="761" y="686" text-anchor="middle" class="tiny" fill="#fff">A</text>
  <text x="785" y="687" class="body">Strategy A · fixed chunks</text>
  <text x="1238" y="687" text-anchor="end" class="tiny" fill="#a56b0f">KHÔNG FILTER</text>
  <rect x="738" y="715" width="534" height="48" rx="12" fill="#edf8ff"/>
  <circle cx="761" cy="739" r="13" fill="#4b9ae8"/><text x="761" y="743" text-anchor="middle" class="tiny" fill="#fff">B</text>
  <text x="785" y="744" class="body">Strategy B · paragraph chunks</text>
  <text x="1238" y="744" text-anchor="end" class="tiny" fill="#3278ba">KHÔNG FILTER</text>
  <rect x="738" y="772" width="534" height="48" rx="12" fill="#eafaf5"/>
  <circle cx="761" cy="796" r="13" fill="#16a58f"/><text x="761" y="800" text-anchor="middle" class="tiny" fill="#fff">C</text>
  <text x="785" y="792" class="body">Strategy C · dùng B + filter</text>
  <text x="785" y="810" class="tiny" fill="#118e7c">WHERE metadata.section = filter khi câu hỏi cung cấp</text>

  <!-- user output -->
  <g filter="url(#shadow)">
    <rect x="1333" y="565" width="407" height="280" rx="22" fill="#fff"/>
    <rect x="1333" y="565" width="407" height="9" rx="5" fill="#1c9d78"/>
  </g>
  <circle cx="1375" cy="610" r="24" fill="#e5f8f0"/>
  <path d="M1364 600h18v21h-18zM1368 606h10M1368 611h10M1368 616h7" fill="none" stroke="#188963" stroke-width="2" stroke-linecap="round"/>
  <text x="1411" y="617" class="cardTitle">Output trả về</text>
  <text x="1355" y="663" class="body">3 đoạn liên quan nhất</text>
  <text x="1355" y="692" class="small">chunk text · score · chunk_id</text>
  <text x="1355" y="720" class="small">document_id · source · page</text>
  <text x="1355" y="748" class="small">metadata.section</text>
  <rect x="1355" y="766" width="363" height="1" fill="#e8edf5"/>
  <text x="1355" y="795" class="tiny" fill="#b05a36">LƯU TRACE</text>
  <text x="1355" y="821" class="mono">retrieval_traces.jsonl</text>
  <text x="1355" y="840" class="tiny">ĐÂY LÀ EVIDENCE RETRIEVAL · CHƯA CÓ LLM VIẾT ĐÁP ÁN</text>

  <!-- Query arrows -->
  <path d="M354 706h24" fill="none" stroke="#7085a4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M679 706h24" fill="none" stroke="#7085a4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1302 706h23" fill="none" stroke="#7085a4" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- evaluation / artifacts strip -->
  <text x="60" y="913" class="section">03 · ĐÁNH GIÁ VÀ ARTIFACTS</text>
  <g filter="url(#shadow)">
    <rect x="60" y="936" width="520" height="246" rx="22" fill="#fff"/>
    <rect x="60" y="936" width="520" height="8" rx="4" fill="#8b63ee"/>
    <rect x="640" y="936" width="520" height="246" rx="22" fill="#fff"/>
    <rect x="640" y="936" width="520" height="8" rx="4" fill="#3787e8"/>
    <rect x="1220" y="936" width="520" height="246" rx="22" fill="#fff"/>
    <rect x="1220" y="936" width="520" height="8" rx="4" fill="#f3a62f"/>
  </g>
  <text x="88" y="984" class="cardTitle">Tự động: retrieval metrics</text>
  <text x="88" y="1018" class="body">Gold source/page + evidence_quote</text>
  <text x="88" y="1046" class="small">Hit@1 · Evidence Hit@3 · tách dev/test</text>
  <text x="88" y="1086" class="mono">retrieval_summary.json</text>
  <rect x="88" y="1111" width="463" height="1" fill="#e8edf5"/>
  <text x="88" y="1141" class="small">Exact quote trong 1 chunk; cần audit nếu</text>
  <text x="88" y="1164" class="small">evidence bị chia qua nhiều chunk.</text>

  <text x="668" y="984" class="cardTitle">Files được tạo</text>
  <text x="668" y="1018" class="mono">ingestion_log.jsonl</text>
  <text x="668" y="1045" class="mono">chunks_A_fixed.jsonl</text>
  <text x="668" y="1072" class="mono">chunks_B_paragraph.jsonl</text>
  <text x="668" y="1100" class="mono">retrieval_traces.jsonl</text>
  <text x="668" y="1127" class="mono">retrieval_summary.json</text>
  <text x="668" y="1164" class="small">Docker Compose · PostgreSQL + pgvector</text>

  <text x="1248" y="984" class="cardTitle">Đánh giá thủ công</text>
  <text x="1248" y="1018" class="body">Coherence · metadata · grounding</text>
  <text x="1248" y="1046" class="small">Chấm chunk / evidence, không chấm LLM answer</text>
  <text x="1248" y="1086" class="small">Đối chiếu nguồn/trang và filter section</text>
  <rect x="1248" y="1111" width="463" height="1" fill="#e8edf5"/>
  <text x="1248" y="1141" class="small">Thời gian/chi phí cần đo và ghi riêng;</text>
  <text x="1248" y="1164" class="small">không suy ra từ score retrieval.</text>

  <text x="60" y="1230" class="tiny">THỰC TẾ THEO SRC: A/B ĐƯỢC EMBED VÀ LƯU; C TÁI DÙNG VECTOR B VÀ CHỈ THÊM METADATA FILTER Ở BƯỚC SEARCH.</text>
</svg>
